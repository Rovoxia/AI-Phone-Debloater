    Universal Rootless Android ADB Debloater
  </text>

  <!-- Description paragraph -->
  <text x="100" y="305" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
