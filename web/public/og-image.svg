  <!-- Brand badge -->
  <g transform="translate(100, 80)">
    <rect width="210" height="38" rx="19" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#10b981" />
    <text x="36" y="24" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="0.5">ROVOXIA OPEN SOURCE</text>
  </g>

