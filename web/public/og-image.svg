    <text x="215" y="26" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="600">✓ Auto-Snapshot (JSON)</text>

    <!-- Pill 3 -->
    <rect x="405" y="0" width="185" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="425" y="26" fill="#a78bfa" font-family="monospace" font-size="15" font-weight="600">✓ 320+ OEM Rules</text>

    <!-- Pill 4 -->
    <rect x="605" y="0" width="195" height="42" rx="10" fill="#1f2937" stroke="#374151" stroke-width="1" />
    <text x="625" y="26" fill="#f43f5e" font-family="monospace" font-size="15" font-weight="600">✓ 61 Pkg Blacklist</text>
  </g>

  <!-- Terminal Preview Card on the bottom right -->
  <g transform="translate(100, 460)">
    <rect width="1000" height="110" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="25" cy="25" r="5" fill="#ef4444" />
    <circle cx="42" cy="25" r="5" fill="#f59e0b" />
    <circle cx="59" cy="25" r="5" fill="#10b981" />
    <text x="85" y="29" fill="#64748b" font-family="monospace" font-size="13">terminal — python scripts/debloat-engine.py scan</text>
    <text x="25" y="65" fill="#38bdf8" font-family="monospace" font-size="16">$ python scripts/debloat-engine.py scan</text>
