server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Keep in step with public/_headers (Cloudflare Pages).
    # The full Content-Security-Policy is a <meta> tag that Astro writes into every page;
    # frame-ancestors is ignored there, so it is sent as a header.
    # The locations below inherit these only while they declare no add_header of their own.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Pages are built as /app.html, /blog.html, /blog/<slug>.html (build.format: 'file' in
    # astro.config.mjs) and served at the slash-less URL through $uri.html.
    # /blog/ would otherwise match the blog/ directory, which has no index file: send any
    # trailing-slash URL to its canonical form, as Cloudflare Pages does. The query string is kept.
    rewrite ^/(.+)/$ /$1 permanent;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Hashed build output (CSS, JS, fonts): the file name changes with the content, so cache for a
    # year. A location with its own add_header inherits none from the server block, so the
    # security headers are repeated here.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;

    location ~ \.(sh|ps1|txt)$ {
        types { }
        default_type text/plain;
    }

    location ~ \.md$ {
        types { }
        default_type text/markdown;
    }

    # nginx's stock mime.types has no entry for .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/manifest+json image/svg+xml;
}
