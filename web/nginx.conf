server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Keep in step with public/_headers (Cloudflare Pages).
    # The full Content-Security-Policy is a <meta> tag that Astro writes into every page;
    # frame-ancestors is ignored there, so it is sent as a header.
    # The locations below inherit these only while they declare no add_header of their own.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    location ~ \.(sh|ps1|txt)$ {
        types { }
        default_type text/plain;
    }

    location ~ \.md$ {
        types { }
        default_type text/markdown;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;
}
