name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Rule JSON Files
        run: python cli/tests/validate_rules.py

      - name: Compile Python sources
        run: python -m py_compile cli/src/debloat_engine.py cli/tests/validate_rules.py

      - name: Verify Debloat Engine CLI Help
        run: python cli/src/debloat_engine.py --help

      - name: Lint Shell Launcher (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash -n cli/bin/debloat.sh

      - name: Launcher smoke test (--version)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cmd //c "cli\bin\debloat.bat --version"; else bash cli/bin/debloat.sh --version; fi

  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web dashboard
        working-directory: web
        run: |
          npm ci
          npm run build
