name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Rule JSON Files
        run: python tests/validate_rules.py

      - name: Verify Debloat Engine CLI Syntax & Help
        run: python scripts/debloat-engine.py --help

      - name: Lint Shell Scripts (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/setup-adb.sh
          bash -n debloat.sh
          echo "Bash scripts syntax OK."

      - name: Lint PowerShell Scripts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem scripts/*.ps1 -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref] $null, [ref] $errors)
            if ($errors) {
              Write-Host "Parse errors in $($f.Name):"
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
              exit 1
            }
          }
          Write-Host "PowerShell syntax verified OK."
