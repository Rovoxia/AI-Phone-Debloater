name: CI/CD Pipeline - AI-Phone-Debloater

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------- Lint ----------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint shell launcher
        run: shellcheck cli/bin/debloat.sh

      - name: Python syntax check
        run: python -m py_compile cli/src/debloat_engine.py cli/src/bridge_server.py cli/tests/validate_rules.py cli/tests/test_connection.py cli/tests/test_bridge_server.py

      - name: Python style check
        run: |
          pip install ruff
          ruff check cli/src/debloat_engine.py cli/tests/ --output-format=github

      - name: Shellcheck web runner script
        run: |
          # Extract embedded bash from run.sh.ts into temp file and lint
          python - <<'PYEOF'
          import re, pathlib, subprocess, tempfile, os
          src = pathlib.Path("web/src/pages/run.sh.ts").read_text(encoding="utf-8")
          m = re.search(r"scriptContent = `([\s\S]*?)`;", src)
          script = m.group(1).replace("${", "$").replace("\\$", "$")
          with tempfile.NamedTemporaryFile("w", suffix=".sh", delete=False) as f:
              f.write(script)
              p = f.name
          try:
              r = subprocess.run(["shellcheck", p], capture_output=True, text=True)
              if r.stdout or r.returncode != 0:
                  print(r.stdout + r.stderr)
              raise SystemExit(r.returncode)
          finally:
              os.unlink(p)
          PYEOF

  # ---------- Validation ----------
  validate:
    name: Validate Engine & Rules
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run rule validation suite
        run: python cli/tests/validate_rules.py

      - name: Run connection subsystem tests
        run: python cli/tests/test_connection.py

      - name: Run bridge server unit tests
        run: python cli/tests/test_bridge_server.py

      - name: Run version SSOT tests
        run: python cli/tests/test_version_ssot.py

      - name: Verify CLI help
        run: python cli/src/debloat_engine.py --help

      - name: Check version consistency
        run: |
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file is missing at repository root"
            exit 1
          fi
          VERSION_FILE=$(cat VERSION | tr -d '\r\n')
          echo "VERSION=$VERSION_FILE" >> $GITHUB_ENV
          python -c "import sys; sys.path.insert(0, 'cli/src'); import debloat_engine as e; assert e.__version__ == '$VERSION_FILE', f'version mismatch: engine={e.__version__} file=$VERSION_FILE'"
          python cli/sync_version.py --check

      - name: Verify web dataset matches engine rules
        run: |
          python cli/generate_rules_dataset.py
          git diff --exit-code web/src/data/rules-dataset.json || (echo "::error::web/src/data/rules-dataset.json is out of sync with cli/rules/*. Run 'python cli/generate_rules_dataset.py' and commit." && exit 1)

  # ---------- Tests ----------
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Python test suites
        run: |
          python cli/tests/validate_rules.py
          python cli/tests/test_connection.py
          python cli/tests/test_bridge_server.py
          python cli/tests/test_version_ssot.py

      - name: Compile Python sources
        run: python -m py_compile cli/src/debloat_engine.py cli/src/bridge_server.py cli/tests/validate_rules.py cli/tests/test_connection.py cli/tests/test_bridge_server.py

      - name: Smoke test launcher
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c "cli\bin\debloat.bat --version"
          else
            bash cli/bin/debloat.sh --version
          fi

  web-test:
    name: Web Dashboard Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build web dashboard
        run: npm run build
        working-directory: web

      - name: Smoke test web preview
        run: |
          cd web
          npx astro preview --host 127.0.0.1 > preview.log 2>&1 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4321/ | grep -q "200"
          kill $PREVIEW_PID || true

  # ---------- Security ----------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --source . --verbose --redact

      - name: Audit npm dependencies
        run: |
          cd web
          npm audit --audit-level moderate

  
  # ---------- Final gate summary ----------
  final-status:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, validate, test, web-test, security]
    if: always()

    steps:
      - name: Write job status summary
        run: |
          echo "lint=${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "validate=${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "test=${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "web-test=${{ needs.web-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "security=${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Pipeline status: ${{ needs.lint.result }}"
