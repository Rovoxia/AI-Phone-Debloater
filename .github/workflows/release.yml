name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.merged == true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(cat VERSION | tr -d '\r\n')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version: $TAG"

      - name: Verify version matches VERSION file
        run: |
          FILE_VER=$(cat VERSION | tr -d '\r\n')
          if [ "${{ steps.ver.outputs.tag }}" != "v$FILE_VER" ]; then
            echo "::error::Tag ${{ steps.ver.outputs.tag }} does not match VERSION file ($FILE_VER)"
            exit 1
          fi

      - name: Check existing release
        id: check
        run: |
          EXISTING=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          echo "latest_release=${EXISTING:-none}" >> $GITHUB_OUTPUT
          echo "Latest release tag: ${EXISTING:-none}"

      - name: Skip when already released
        if: steps.check.outputs.latest_release == format('v{0}', steps.ver.outputs.version)
        run: echo "Release ${{ steps.ver.outputs.tag }} already exists. Skipping."

      - name: Generate changelog
        if: steps.check.outputs.latest_release != format('v{0}', steps.ver.outputs.version)
        run: |
          LAST_TAG="${{ steps.check.outputs.latest_release }}"
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)"
          fi
          NOTES=$(git log --pretty=format:"%s" $RANGE | grep -v "^\s*$" | head -100)
          {
            echo "# Release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "## Changes"
            echo '```'
            echo "$NOTES"
            echo '```'
          } > RELEASE_NOTES.md

      - name: Update changelog.md
        if: steps.check.outputs.latest_release != format('v{0}', steps.ver.outputs.version)
        run: |
          {
            echo ""
            echo "# Release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "## Changes"
            echo '```'
            cat RELEASE_NOTES.md | sed '1,/^```$/d' | sed '/^```$/d'
            echo '```'
          } >> CHANGELOG.md
          git add CHANGELOG.md
          git -c user.name="Rovoxia" -c user.email="noreply@anthropic.com" commit -m "docs: update changelog for ${{ steps.ver.outputs.tag }}" || true
          git push origin HEAD || true

      - name: Create GitHub Release
        if: steps.check.outputs.latest_release != format('v{0}', steps.ver.outputs.version)
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "Release ${{ steps.ver.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md